# Оноо, тайлангийн тохиргоо
# Эрсдэлийн түвшин: нийт оноо ≥ high → Өндөр, ≥ medium → Дунд, бусад → Бага (DaHUB-тай ижил)
high: 3.5
medium: 2.5

# Master-ийн "Score" баганын бүлгүүдийн нэр (тайланд харагдана) — агуулгаас нь таамаглаж өгсөн, засаарай
groups:
  score1: Бизнесийн үйл ажиллагаа, үр дүн
  score2: Хүний нөөц, бүтэц, зохицуулалт
  score3: Аудитын үр дүн
  score4: Мэдлэг, нууцлал, харилцагч
  score5: Стратеги, зах зээл
  score6: Аудиторын үнэлэмж
