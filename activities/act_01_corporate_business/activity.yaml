activity_id: ACT_01
activity_name_mn: Байгууллагын бизнесийн үйл ажиллагаа
activity_name_mn_old: Байгууллагын банкны үйл ажиллагаа   # Хуучин нэр (master жагсаалтын "Үйл ажиллагааны нэр (хуучин)")
activity_name_en: Corporate business
owner: dev_a            # Энэ activity-ийн SQL-ийг бичих хүн
reviewer: dev_b         # Review хийх хүн (owner-оос өөр)

# Энэ activity-ийн бүх үзүүлэлтэд өвлөгдөнө. Үзүүлэлтийн YAML-д бичвэл дарна.
defaults:
  connection: oracle_whouse
  frequency: quarterly           # бусад үйл ажиллагаатай ижил (улирал бүр)
  timeout_seconds: 600

# ── Нийтлэг үзүүлэлт (ri.py import үүсгэнэ — id, def, weight, зөрүү нь master-аас; params, enabled, note-ийг гараар нэмж болно) ──
# Олон үйл ажиллагаанд давтагддаг үзүүлэлт: тодорхойлолт activities/_shared/sh_NNN.sql, энд №, жин, зөрүү.
shared:
  - id: RI_01_0001                              # Action plan биелэлт
    def: SH_010
    weight: 1
    method: |
      Action plan-ын хэрэгжилтийн дундаж үнэлгээнд үндэслэн үнэлнэ.
      /ББГ-ын БХАХ, УУДБХ, БСХ, ҮХХ/
  - {id: RI_01_0002, def: SH_029, weight: 1.5}           # Зээлийн төлөвлөгөөний биелэлт
  - {id: RI_01_0003, def: SH_030, weight: 1.5}           # Эх үүсвэрийн төлөвлөгөөний биелэлт
  - {id: RI_01_0004, def: SH_031, weight: 1.5}           # Дотоод үнэлгээний ашгийн төлөвлөгөөний биелэлт
  - {id: RI_01_0006, def: SH_009, weight: 1.5}           # Нийт ногоон зээлийн төлөвлөгөөний биелэлт
  - {id: RI_01_0007, def: SH_032, weight: 1.5}           # Лизингийн багцын төлөвлөгөөни биелэлт
  - {id: RI_01_0008, def: SH_033, weight: 1.5}           # Лизингийн хүүгийн орлогын төлөвлөгөөний биелэлт
  - {id: RI_01_0009, def: SH_034, weight: 1.5}           # АХЗээл/нийт зээл
  - {id: RI_01_0010, def: SH_035, weight: 1.5}           # Чанаргүй зээл/Нийт зээл
  - {id: RI_01_0011, def: SH_036, weight: 1}             # Зээлийн эрсдэлийн сан/Чанаргүй зээл
  - {id: RI_01_0012, def: SH_037, weight: 1}             # Эргэн хяналтын чанар - Corp
  - {id: RI_01_0013, def: SH_038, weight: 1}             # Зээл шийдвэрлэх процессын хурд
  - {id: RI_01_0017, def: SH_028, weight: 1}             # Бизнесийн орчин, зорилтот харилцагчийн судалгаа хийгддэг эсэ
